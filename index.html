<!DOCTYPE html>

<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lektionen Trainer — Выбор уровня</title>

  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

    }



    body {

      background-color: #0f172a;

      color: #f8fafc;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

    }



    .selector-container {

      width: 100%;

      max-width: 500px;

      text-align: center;

    }



    .title {

      font-size: 1.6rem;

      font-weight: 600;

      margin-bottom: 28px;

      color: #f1f5f9;

    }



    .grid {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 20px;

    }



    .option-card {

      background: #1e293b;

      border: 2px solid #334155;

      border-radius: 14px;

      padding: 32px 20px;

      cursor: pointer;

      transition: all 0.2s ease;

      user-select: none;

      text-decoration: none;

      display: block;

    }



    .option-card:hover {

      border-color: #38bdf8;

      background: #243248;

      transform: translateY(-3px);

      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);

    }



    .option-title {

      font-size: 2rem;

      font-weight: 700;

      color: #38bdf8;

      margin-bottom: 8px;

    }



    .option-subtitle {

      font-size: 0.875rem;

      color: #94a3b8;

    }

  </style>

</head>

<body>



  <div class="selector-container">

    <h1 class="title">Выбор уровня тренажера</h1>

    

    <div class="grid">

      <!-- Кнопка A1 -->

      <a class="option-card" href="Lektionen Trainer A1.html">

        <div class="option-title">A1</div>

        <div class="option-subtitle">Lektionen Trainer A1</div>

      </a>



      <!-- Кнопка A2 -->

      <a class="option-card" href="Lektionen Trainer A2.html">

        <div class="option-title">A2</div>

        <div class="option-subtitle">Lektionen Trainer A2</div>

      </a>


       <!-- Кнопка B1 -->

      <a class="option-card" href="Lektionen Trainer B1.html">

        <div class="option-title">B1</div>

        <div class="option-subtitle">Lektionen Trainer B1</div>
        </a>

      
       <!-- Кнопка B2 -->

      <a class="option-card" href="Lektionen Trainer B2.html">

        <div class="option-title">B2</div>

        <div class="option-subtitle">Lektionen Trainer B2</div>

      </a>
    </div>

  </div>



</body>

</html>
